services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_IP_ADDRESS: 0.0.0.0
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 5s
      timeout: 2s
      retries: 20
    ports:
      - 127.0.0.1:8081:8081
    restart: unless-stopped
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  telegram-music-bot:
    build: .
    # ponytail: gid 101 hardcoded to aiogram/telegram-bot-api:latest's
    # internal telegram-bot-api group. If a future image rebuild shifts
    # that gid, re-check with:
    #   docker compose exec telegram-bot-api id telegram-bot-api
    user: "node:101"
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      ALLOWED_USER_ID: ${ALLOWED_USER_ID:?Set ALLOWED_USER_ID in .env}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-500}
      MUSIC_DIR: /music
      TELEGRAM_BOT_API_ROOT: http://telegram-bot-api:8081
    init: true
    restart: unless-stopped
    volumes:
      - ./data/music:/music
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro

volumes:
  telegram-bot-api-data:
